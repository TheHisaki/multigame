<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Duo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>
<body>
    <canvas id="background-canvas"></canvas>

    <div class="global-controls">
        <button id="theme-toggle" class="control-btn" title="Changer de thème">
            <i class="fas fa-moon"></i>
        </button>
        <button id="sound-toggle" class="control-btn" title="Son">
            <i class="fas fa-volume-up"></i>
        </button>
        <a href="index.html" class="control-btn" title="Retour au menu">
            <i class="fas fa-home"></i>
        </a>
    </div>

    <div class="container">
        <div class="game-header">
            <div class="score-container">
                <div class="player-score">
                    <span class="player-name">Joueur 1</span>
                    <span class="score" id="player1-score">0</span>
                </div>
                <div class="score-separator">VS</div>
                <div class="player-score">
                    <span class="score" id="player2-score">0</span>
                    <span class="player-name">Joueur 2</span>
                </div>
            </div>
            <div id="ball-speed"><i class="fas fa-tachometer-alt"></i> Vitesse: 4.0</div>
            <div class="timer"><i class="fas fa-clock"></i> <span id="timer">00:00</span></div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div class="controls-info">
            <button id="start-btn" class="action-btn">
                <i class="fas fa-play"></i> Commencer
            </button>
        </div>

        <div class="mode-selection-screen">
            <h2>Choisissez votre mode de jeu</h2>
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="pc">
                    <i class="fas fa-desktop"></i> PC
                </button>
                <button class="mode-btn" data-mode="tablet">
                    <i class="fas fa-tablet-alt"></i> Tablette
                </button>
            </div>
            <div class="player-controls pc-controls">
                <div class="control-group">
                    <span class="key">Z</span>
                    <span class="key">S</span>
                    <span class="control-desc">Joueur 1</span>
                </div>
                <div class="control-group">
                    <span class="key">↑</span>
                    <span class="key">↓</span>
                    <span class="control-desc">Joueur 2</span>
                </div>
            </div>
        </div>

        <div class="tablet-controls hidden">
            <div class="touch-controls left-controls">
                <button class="touch-btn up-btn" data-player="1" data-direction="up">
                    <i class="fas fa-chevron-up"></i>
                </button>
                <button class="touch-btn down-btn" data-player="1" data-direction="down">
                    <i class="fas fa-chevron-down"></i>
                </button>
            </div>
            <div class="touch-controls right-controls">
                <button class="touch-btn up-btn" data-player="2" data-direction="up">
                    <i class="fas fa-chevron-up"></i>
                </button>
                <button class="touch-btn down-btn" data-player="2" data-direction="down">
                    <i class="fas fa-chevron-down"></i>
                </button>
            </div>
        </div>
    </div>

    <div id="victory-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Victoire ! 🎉</h2>
            <div class="winner-info">
                <span id="winner-text">Joueur 1</span>
                <span>remporte la partie !</span>
            </div>
            <div class="final-stats">
                <div class="stat">
                    <i class="fas fa-clock"></i>
                    <span id="final-time">00:00</span>
                </div>
                <div class="stat">
                    <i class="fas fa-trophy"></i>
                    <span id="final-score">0 - 0</span>
                </div>
            </div>
            <div class="buttons">
                <button id="rematch-btn" class="action-btn">
                    <i class="fas fa-redo"></i> Revanche
                </button>
            </div>
        </div>
    </div>

    <style>

            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --success-color: #06d6a0;
            --error-color: #ef476f;
            --warning-color: #ffca3a;
            --info-color: #118ab2;
            --background-color: #f8f9fa;
            --card-color: #ffffff;
            --text-color: #212529;
            --text-secondary: #6c757d;
            --border-color: #e9ecef;
            --border-radius: 12px;
            --box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            --transition-speed: 0.3s;
        }

            --background-color: #1a1a1a;
            --card-color: #2d2d2d;
            --text-color: #ffffff;
            --text-secondary: #a0a0a0;
            --border-color: #404040;

            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: transparent;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        #background-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            padding: 20px;
            z-index: 1;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px 25px;
            border-radius: var(--border-radius);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .score-container {
            display: flex;
            align-items: center;
            gap: 30px;
            font-size: 2em;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 20px;
            border-radius: var(--border-radius);
            border: 1px solid rgba(255, 255, 255, 0.1);

        .player-score {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            min-width: 100px;
        }

        .player-name {
            font-size: 0.4em;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score {
            font-size: 1.2em;
            color: var(--primary-color);
            text-shadow: 0 0 10px rgba(67, 97, 238, 0.5);
        }

        .score-separator {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.8em;
        }

        #ball-speed {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 20px;
            border-radius: var(--border-radius);
            font-size: 1em;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 140px;
            justify-content: center;
        }

        .timer {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 20px;
            border-radius: var(--border-radius);
            font-size: 1.2em;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 120px;
            justify-content: center;

        #gameCanvas {
            width: 100%;
            aspect-ratio: 16/9;
            background: rgba(0, 0, 0, 0.2);
            border-radius: var(--border-radius);
            margin-bottom: 20px;
        }

        .controls-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;

        .mode-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;

            border-radius: 20px;

        .mode-btn.active {

            background: rgba(255, 255, 255, 0.2);
        }

        .mode-btn.active:hover {
            background: var(--secondary-color);
        }

        .mode-selection-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: var(--border-radius);
            text-align: center;

            font-size: 1.8em;
        }

        .mode-selection-screen.hidden {

        .tablet-controls {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        .touch-controls {
            position: fixed;
            width: 120px;
            height: 300px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            pointer-events: auto;
            top: 50%;
            transform: translateY(-50%);
        }

        .left-controls {
            left: calc(50% - 560px); /* Augmenté de 460px à 560px */
        }

        .right-controls {
            right: calc(50% - 560px); /* Augmenté de 460px à 560px */
        }

        .touch-btn {
            width: 100%;
            height: 120px;
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 2em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .touch-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .touch-btn:active {

            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.6);
        }

        .touch-btn i {
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }

        .global-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }

        .control-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .control-btn i {
            font-size: 1.2em;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .action-btn {
            background: var(--primary-color);
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: var(--secondary-color);
            transform: scale(1.05);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: var(--border-radius);
            text-align: center;
            color: white;
        }

        .modal h2 {
            font-size: 2em;
            margin-bottom: 20px;
        }

        .winner-info {
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        .final-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
        }

        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .stat i {
            font-size: 1.5em;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 1200px) {
            .left-controls {
                left: calc(50% - 500px); /* Augmenté de 400px à 500px */
            }

            .right-controls {
                right: calc(50% - 500px); /* Augmenté de 400px à 500px */
            }
            
            .touch-controls {
                width: 100px;
                height: 250px;
            }

            .touch-btn {
                height: 100px;
                font-size: 1.5em;
            }
        }

        @media (max-width: 768px) {
            .left-controls {
                left: 20px;
            }

            .right-controls {
                right: 20px;
            }
            
            .touch-controls {
                width: 80px;
                height: 200px;
            }

            .touch-btn {
                height: 80px;
                font-size: 1.2em;
            }

    <script>
        // Configuration du jeu
        const config = {
            paddleHeight: 100,
            paddleWidth: 10,
            paddleSpeed: 5,
            ballSize: 10,
            ballSpeed: 4,
            ballSpeedIncrement: 0.3,
            maxBallSpeed: 15,
            winScore: 5,
            powerUpInterval: 10000, // Intervalle d'apparition des power-ups (10 secondes)
            powerUpDuration: 5000,  // Durée des power-ups (5 secondes)
            powerUpSize: 40,        // Taille des power-ups augmentée à 40
            maxPowerUps: 3          // Nombre maximum de power-ups sur le terrain
        };

        // État du jeu
        const gameState = {
            player1: {
                y: 0,
                score: 0,
                isMovingUp: false,
                isMovingDown: false,
                powerUp: null
            },
            player2: {
                y: 0,
                score: 0,
                isMovingUp: false,
                isMovingDown: false,
                powerUp: null
            },
            ball: {
                x: 0,
                y: 0,
                dx: 0,
                dy: 0,
                speed: config.ballSpeed,
                baseSpeed: config.ballSpeed
            },
            powerUps: [],
            isPlaying: false,
            timer: null,
            seconds: 0,
            powerUpTimer: null
        };

        // Types de power-ups
        const powerUpTypes = [
            {
                type: 'bigPaddle',
                color: '#06d6a0',
                icon: '⬆️',
                apply: (player) => {
                    const originalHeight = config.paddleHeight;
                    config.paddleHeight = 150;
                    setTimeout(() => {
                        config.paddleHeight = originalHeight;
                    }, config.powerUpDuration);
                }
            },
            {
                type: 'speedBoost',
                color: '#ffca3a',
                icon: '⚡',
                apply: (player) => {
                    const originalSpeed = config.paddleSpeed;
                    config.paddleSpeed = 8;
                    setTimeout(() => {
                        config.paddleSpeed = originalSpeed;
                    }, config.powerUpDuration);
                }
            },
            {
                type: 'slowBall',
                color: '#118ab2',
                icon: '🐌',
                apply: (player) => {
                    const originalSpeed = gameState.ball.speed;
                    gameState.ball.speed = Math.max(config.ballSpeed, gameState.ball.speed * 0.7);
                    setTimeout(() => {
                        gameState.ball.speed = originalSpeed;
                    }, config.powerUpDuration);
                }
            }
        ];

        // Fonction pour générer un power-up aléatoire
        function spawnPowerUp() {
            if (!gameState.isPlaying) return;
            
            // Vérifier si on a atteint le nombre maximum de power-ups
            if (gameState.powerUps.length >= config.maxPowerUps) return;
            
            const powerUp = {
                x: Math.random() * (canvas.width - 100) + 50,
                y: Math.random() * (canvas.height - 100) + 50,
                type: powerUpTypes[Math.floor(Math.random() * powerUpTypes.length)],
                collected: false
            };
            
            gameState.powerUps.push(powerUp);
        }

        // Fonction pour démarrer le spawn des power-ups
        function startPowerUpSpawning() {
            gameState.powerUpTimer = setInterval(spawnPowerUp, config.powerUpInterval);
        }

        // Fonction pour arrêter le spawn des power-ups
        function stopPowerUpSpawning() {
            if (gameState.powerUpTimer) {
                clearInterval(gameState.powerUpTimer);
                gameState.powerUpTimer = null;
            }
            gameState.powerUps = [];
        }

        // Fonction pour vérifier la collision avec les power-ups
        function checkPowerUpCollision() {
            for (let i = gameState.powerUps.length - 1; i >= 0; i--) {
                const powerUp = gameState.powerUps[i];
                if (powerUp.collected) continue;

                const ballCenterX = gameState.ball.x;
                const ballCenterY = gameState.ball.y;
                const powerUpCenterX = powerUp.x + config.powerUpSize / 2;
                const powerUpCenterY = powerUp.y + config.powerUpSize / 2;

                const distance = Math.sqrt(
                    Math.pow(ballCenterX - powerUpCenterX, 2) +
                    Math.pow(ballCenterY - powerUpCenterY, 2)
                );

                if (distance < (config.ballSize + config.powerUpSize) / 2) {
                    // Déterminer quel joueur obtient le power-up
                    const player = gameState.ball.dx > 0 ? gameState.player1 : gameState.player2;
                    powerUp.type.apply(player);
                    gameState.powerUps.splice(i, 1);
                }
            }
        }

        // Initialisation du canvas
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = (container.clientWidth * 9) / 16;
            
            // Réinitialiser les positions
            const centerY = canvas.height / 2 - config.paddleHeight / 2;
            gameState.player1.y = centerY;
            gameState.player2.y = centerY;
            resetBall();
        }

        // Réinitialiser la balle
        function resetBall() {
            gameState.ball.x = canvas.width / 2;
            gameState.ball.y = canvas.height / 2;
            gameState.ball.speed = config.ballSpeed;
            
            // Direction aléatoire
            const angle = (Math.random() * Math.PI/4) + Math.PI/8;
            const direction = Math.random() < 0.5 ? 1 : -1;
            gameState.ball.dx = Math.cos(angle) * direction;
            gameState.ball.dy = Math.sin(angle) * (Math.random() < 0.5 ? 1 : -1);
        }

        // Démarrer le jeu
        function startGame() {
            if (gameState.isPlaying) return;
            
            gameState.isPlaying = true;
            document.getElementById('start-btn').style.display = 'none';
            
            // Démarrer le timer
            gameState.timer = setInterval(() => {
                gameState.seconds++;
                const minutes = Math.floor(gameState.seconds / 60);
                const seconds = gameState.seconds % 60;
                document.getElementById('timer').textContent = 
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }, 1000);
            
            // Démarrer le spawn des power-ups
            startPowerUpSpawning();
            
            // Démarrer la boucle de jeu
            gameLoop();
        }

        // Boucle principale du jeu
        function gameLoop() {
            if (!gameState.isPlaying) return;

            // Mettre à jour les positions
            updatePaddles();
            updateBall();
            
            // Dessiner
            draw();
            
            // Continuer la boucle
            requestAnimationFrame(gameLoop);
        }

        // Mettre à jour les raquettes
        function updatePaddles() {
            // Joueur 1
            if (gameState.player1.isMovingUp) {
                gameState.player1.y = Math.max(0, gameState.player1.y - config.paddleSpeed);
            }
            if (gameState.player1.isMovingDown) {
                gameState.player1.y = Math.min(
                    canvas.height - config.paddleHeight,
                    gameState.player1.y + config.paddleSpeed
                );
            }
            
            // Joueur 2
            if (gameState.player2.isMovingUp) {
                gameState.player2.y = Math.max(0, gameState.player2.y - config.paddleSpeed);
            }
            if (gameState.player2.isMovingDown) {
                gameState.player2.y = Math.min(
                    canvas.height - config.paddleHeight,
                    gameState.player2.y + config.paddleSpeed
                );
            }
        }

        // Mettre à jour la balle
        function updateBall() {
            // Déplacer la balle
            gameState.ball.x += gameState.ball.dx * gameState.ball.speed;
            gameState.ball.y += gameState.ball.dy * gameState.ball.speed;
            
            // Collision avec les murs (haut/bas)
            if (gameState.ball.y <= 0 || gameState.ball.y >= canvas.height) {
                gameState.ball.dy *= -1;
                gameState.ball.speed = Math.min(
                    gameState.ball.speed + config.ballSpeedIncrement * 0.7,
                    config.maxBallSpeed
                );
            }
            
            // Collision avec les raquettes
            // Joueur 1
            if (gameState.ball.x <= config.paddleWidth &&
                gameState.ball.y >= gameState.player1.y &&
                gameState.ball.y <= gameState.player1.y + config.paddleHeight) {
                gameState.ball.dx *= -1;
                // Augmenter la vitesse à chaque rebond
                gameState.ball.speed = Math.min(
                    gameState.ball.speed + config.ballSpeedIncrement,
                    config.maxBallSpeed
                );
                // Ajuster l'angle en fonction de l'endroit où la balle frappe la raquette
                const relativeIntersectY = (gameState.player1.y + (config.paddleHeight / 2)) - gameState.ball.y;
                const normalizedIntersectY = relativeIntersectY / (config.paddleHeight / 2);
                const bounceAngle = normalizedIntersectY * Math.PI / 3;
                const newDy = -Math.sin(bounceAngle);
                gameState.ball.dy = newDy * Math.abs(gameState.ball.speed / config.ballSpeed);
            }
            
            // Joueur 2
            if (gameState.ball.x >= canvas.width - config.paddleWidth &&
                gameState.ball.y >= gameState.player2.y &&
                gameState.ball.y <= gameState.player2.y + config.paddleHeight) {
                gameState.ball.dx *= -1;
                // Augmenter la vitesse à chaque rebond
                gameState.ball.speed = Math.min(
                    gameState.ball.speed + config.ballSpeedIncrement,
                    config.maxBallSpeed
                );
                // Ajuster l'angle en fonction de l'endroit où la balle frappe la raquette
                const relativeIntersectY = (gameState.player2.y + (config.paddleHeight / 2)) - gameState.ball.y;
                const normalizedIntersectY = relativeIntersectY / (config.paddleHeight / 2);
                const bounceAngle = normalizedIntersectY * Math.PI / 3;
                const newDy = -Math.sin(bounceAngle);
                gameState.ball.dy = newDy * Math.abs(gameState.ball.speed / config.ballSpeed);
            }
            
            // Vérifier les collisions avec les power-ups
            checkPowerUpCollision();
            
            // Point marqué
            if (gameState.ball.x <= 0) {
                // Point pour joueur 2
                gameState.player2.score++;
                updateScore();
                if (gameState.player2.score >= config.winScore) {
                    endGame(2);
                } else {
                    resetBall();
                }
            } else if (gameState.ball.x >= canvas.width) {
                // Point pour joueur 1
                gameState.player1.score++;
                updateScore();
                if (gameState.player1.score >= config.winScore) {
                    endGame(1);
                } else {
                    resetBall();
                }
            }
        }

        // Dessiner le jeu
        function draw() {
            // Effacer le canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Mettre à jour l'affichage de la vitesse dans le header
            document.getElementById('ball-speed').innerHTML = 
                `<i class="fas fa-tachometer-alt"></i> Vitesse: ${Math.round(gameState.ball.speed * 10) / 10}`;
            
            // Dessiner la ligne centrale
            ctx.setLineDash([5, 15]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Dessiner les raquettes
            ctx.fillStyle = 'white';
            // Joueur 1
            ctx.fillRect(0, gameState.player1.y, config.paddleWidth, config.paddleHeight);
            // Joueur 2
            ctx.fillRect(
                canvas.width - config.paddleWidth,
                gameState.player2.y,
                config.paddleWidth,
                config.paddleHeight
            );
            
            // Dessiner les power-ups
            gameState.powerUps.forEach(powerUp => {
                if (powerUp.collected) return;
                
                ctx.fillStyle = powerUp.type.color;
                ctx.beginPath();
                ctx.arc(
                    powerUp.x + config.powerUpSize / 2,
                    powerUp.y + config.powerUpSize / 2,
                    config.powerUpSize / 2,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
                
                // Dessiner l'icône
                ctx.font = '16px Arial';
                ctx.fillStyle = 'white';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(
                    powerUp.type.icon,
                    powerUp.x + config.powerUpSize / 2,
                    powerUp.y + config.powerUpSize / 2
                );
            });
            
            // Dessiner la balle
            ctx.beginPath();
            ctx.arc(gameState.ball.x, gameState.ball.y, config.ballSize, 0, Math.PI * 2);
            ctx.fill();
        }

        // Mettre à jour le score
        function updateScore() {
            document.getElementById('player1-score').textContent = gameState.player1.score;
            document.getElementById('player2-score').textContent = gameState.player2.score;
        }

        // Fin de partie
        function endGame(winner) {
            gameState.isPlaying = false;
            clearInterval(gameState.timer);
            stopPowerUpSpawning(); // Nettoyer les power-ups à la fin
            
            const minutes = Math.floor(gameState.seconds / 60);
            const seconds = gameState.seconds % 60;
            document.getElementById('final-time').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            document.getElementById('final-score').textContent = 
                `${gameState.player1.score} - ${gameState.player2.score}`;
            document.getElementById('winner-text').textContent = `Joueur ${winner}`;
            
            document.getElementById('victory-modal').classList.remove('hidden');
        }

        // Recommencer une partie
        function resetGame() {
            gameState.player1.score = 0;
            gameState.player2.score = 0;
            gameState.seconds = 0;
            document.getElementById('timer').textContent = '00:00';
            updateScore();
            
            const centerY = canvas.height / 2 - config.paddleHeight / 2;
            gameState.player1.y = centerY;
            gameState.player2.y = centerY;
            resetBall();
            
            document.getElementById('victory-modal').classList.add('hidden');
            document.getElementById('start-btn').style.display = 'block';
        }

        // Gestionnaire de thème
        let darkMode = localStorage.getItem('darkMode') === 'true';
        
        function toggleTheme() {
            darkMode = !darkMode;
            document.body.setAttribute('data-theme', darkMode ? 'dark' : 'light');
            document.getElementById('theme-toggle').innerHTML = 
                darkMode ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
            localStorage.setItem('darkMode', darkMode);
        }

        // Initialisation
        document.addEventListener('DOMContentLoaded', function() {
            // Initialiser le thème
            if (darkMode) {
                document.body.setAttribute('data-theme', 'dark');
                document.getElementById('theme-toggle').innerHTML = '<i class="fas fa-sun"></i>';
            }

            // Initialiser le canvas
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // Écouteurs d'événements
            document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
            document.getElementById('start-btn').addEventListener('click', () => {
                modeSelectionScreen.classList.add('hidden');
                startGame();
            });
            document.getElementById('rematch-btn').addEventListener('click', resetGame);

            // Gestionnaire de mode (PC/Tablette)
            const modeButtons = document.querySelectorAll('.mode-btn');
            const pcControls = document.querySelector('.pc-controls');
            const tabletControls = document.querySelector('.tablet-controls');
            const modeSelectionScreen = document.querySelector('.mode-selection-screen');
            
            modeButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    modeButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    if (btn.dataset.mode === 'pc') {
                        pcControls.classList.remove('hidden');
                        tabletControls.classList.add('hidden');
                    } else {
                        pcControls.classList.add('hidden');
                        tabletControls.classList.remove('hidden');
                    }
                });
            });

            // Contrôles tactiles
            const touchButtons = document.querySelectorAll('.touch-btn');
            
            touchButtons.forEach(btn => {
                const player = btn.dataset.player === '1' ? gameState.player1 : gameState.player2;
                const direction = btn.dataset.direction;
                
                // Gestion du toucher continu
                let touchInterval;
                
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (direction === 'up') {
                        player.isMovingUp = true;
                        player.isMovingDown = false;
                    } else {
                        player.isMovingDown = true;
                        player.isMovingUp = false;
                    }
                });
                
                btn.addEventListener('touchend', () => {
                    if (direction === 'up') {
                        player.isMovingUp = false;
                    } else {
                        player.isMovingDown = false;
                    }
                });
                
                // Support pour la souris (pour les tests sur desktop)
                btn.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    if (direction === 'up') {
                        player.isMovingUp = true;
                        player.isMovingDown = false;
                    } else {
                        player.isMovingDown = true;
                        player.isMovingUp = false;
                    }
                });
                
                btn.addEventListener('mouseup', () => {
                    if (direction === 'up') {
                        player.isMovingUp = false;
                    } else {
                        player.isMovingDown = false;
                    }
                });
                
                btn.addEventListener('mouseleave', () => {
                    if (direction === 'up') {
                        player.isMovingUp = false;
                    } else {
                        player.isMovingDown = false;
                    }
                });
            });

            // Contrôles clavier (mode PC)
            document.addEventListener('keydown', function(e) {
                if (document.querySelector('.mode-btn[data-mode="pc"]').classList.contains('active')) {
                    switch(e.key) {
                        case 'z':
                            gameState.player1.isMovingUp = true;
                            break;
                        case 's':
                            gameState.player1.isMovingDown = true;
                            break;
                        case 'ArrowUp':
                            gameState.player2.isMovingUp = true;
                            break;
                        case 'ArrowDown':
                            gameState.player2.isMovingDown = true;
                            break;
                    }
                }
            });

            document.addEventListener('keyup', function(e) {
                switch(e.key) {
                    case 'z':
                        gameState.player1.isMovingUp = false;
                        break;
                    case 's':
                        gameState.player1.isMovingDown = false;
                        break;
                    case 'ArrowUp':
                        gameState.player2.isMovingUp = false;
                        break;
                    case 'ArrowDown':
                        gameState.player2.isMovingDown = false;
                        break;
                }
            });

            // Animation du fond
            initBackground();
        });

        // Code d'animation du fond (même que dans les autres jeux)
        function initBackground() {
            const canvas = document.getElementById('background-canvas');
            const ctx = canvas.getContext('2d');
            let particles = [];
            
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
            
            class Particle {
                constructor() {
                    this.reset();
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                }
                
                reset() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 5 + 1;
                    this.speedX = Math.random() * 3 - 1.5;
                    this.speedY = Math.random() * 3 - 1.5;
                    this.color = `hsla(${Math.random() * 60 + 220}, 70%, 70%, ${Math.random() * 0.3 + 0.1})`;
                    this.life = 100;
                }
                
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    this.life -= 0.2;
                    
                    if (this.life <= 0) {
                        this.reset();
                    }
                    
                    if (this.x > canvas.width || this.x < 0 || this.y > canvas.height || this.y < 0) {
                        this.reset();
                    }
                }
                
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                    
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = this.color;
                }
            }
            
            function init() {
                particles = [];
                for (let i = 0; i < 100; i++) {
                    particles.push(new Particle());
                }
            }
            
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                const time = Date.now() * 0.001;
                const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                gradient.addColorStop(0, `hsl(${220 + Math.sin(time) * 10}, 70%, 20%)`);
                gradient.addColorStop(1, `hsl(${240 + Math.cos(time) * 10}, 70%, 25%)`);
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.shadowBlur = 0;
                
                particles.forEach(particle => {
                    particle.update();
                    particle.draw();
                });
                
                requestAnimationFrame(animate);
            }
            
            init();
            animate();
        }
    </script>
